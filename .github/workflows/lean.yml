name: Check proofs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Print statements and axioms
        run: lake env lean Audit.lean
      - name: Python checks
        run: |
          python3 results/symmetric-spiders/scripts/verify.py 60 --general-through 10
          python3 results/symmetric-spiders/scripts/check_lean_construction.py
      - name: Backbite checks
        run: |
          sudo apt-get update && sudo apt-get install -y nauty
          cd results/backbite-dirac/scripts
          for n in 3 4 5 6 7 8 9; do python3 verify_dirac.py $n; done
          python3 verify_moves.py
